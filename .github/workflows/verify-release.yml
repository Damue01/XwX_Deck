name: Verify published update
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify (must be latest)
        required: true
        default: v1.0.0
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Build older test executable
        run: node tools/build-update-baseline.mjs
      - name: Download public assets anonymously
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          mkdir -p release
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            curl --fail --location --retry 3 "$BASE/XwX-Deck-windows-x64.exe" -o 'release/XwX Deck.exe'
          else
            curl --fail --location --retry 3 "$BASE/XwX-Deck-mac-arm64.dmg" -o release/XwX-Deck-mac-arm64.dmg
          fi
      - name: Verify anonymous production update feed end to end
        run: node tools/run-packaged-update-smoke.mjs --github
      - name: Save actual update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-update-${{ runner.os }}
          path: test-results/
          if-no-files-found: error
